name: Build Play Store Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore & Build Release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Locate project root by finding settings.gradle or build.gradle
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            PROJECT_DIR="."
          fi
          echo "Project directory found: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Generate Gradle Wrapper if missing
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating gradle wrapper automatically..."
            gradle wrapper
          fi

          # 3. Fix line endings and grant execute permissions
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          # 4. Reconstruct the release.jks from GitHub Secret
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

          # 5. Build the signed AAB
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload AAB to Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/build/outputs/bundle/release/*.aab"
